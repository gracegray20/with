<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>WITH · 사진</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" />
    <!-- shared base (reset, phone frame, status bar, bottom nav) -->
    <link rel="stylesheet" href="community.css" />
    <link rel="stylesheet" href="photo.css" />
  </head>
  <body>
    <div class="phone photo-page">
      <div class="top">
        <div class="status-bar">
          <span class="status-bar__time">9:41</span>
          <div class="status-bar__icons">
            <img src="public/assets/community/ios-signal.svg" alt="" width="18" height="17" />
            <img src="public/assets/community/ios-wifi.svg" alt="" width="17" height="17" />
            <img src="public/assets/community/ios-battery.svg" alt="" width="27" height="19" />
          </div>
        </div>

        <header class="photo-header">
          <a href="index.html" class="header__logo photo-header__logo">WITH</a>
          <div class="view-toggle" role="group" aria-label="보기 방식">
            <button class="view-toggle__btn view-toggle__btn--large is-active" type="button" aria-pressed="true" aria-label="크게 보기" data-view="large">
              <span></span><span></span><span></span>
            </button>
            <button class="view-toggle__btn view-toggle__btn--grid" type="button" aria-pressed="false" aria-label="격자 보기" data-view="grid">
              <span></span><span></span><span></span><span></span>
            </button>
          </div>
        </header>
      </div>

      <main class="gallery" data-view="large">
        <a href="#" class="trip">
          <img class="trip__photo" src="public/assets/photo/switzerland.jpg" alt="스위스 알프스 마을과 호수" />
          <h2 class="trip__title">스위스</h2>
          <p class="trip__date">2024.12.11</p>
        </a>
        <a href="#" class="trip">
          <img class="trip__photo" src="public/assets/photo/london.jpg" alt="런던 템스강 풍경" />
          <h2 class="trip__title">런던</h2>
          <p class="trip__date">2024.12.11</p>
        </a>
        <a href="#" class="trip">
          <img class="trip__photo" src="public/assets/photo/tokyo.png" alt="도쿄 거리 풍경" />
          <h2 class="trip__title">도쿄</h2>
          <p class="trip__date">2024.12.11</p>
        </a>
      </main>

      <nav class="bottom-nav" aria-label="주요 메뉴">
        <a href="index.html" class="bottom-nav__item">
          <img src="public/assets/community/nav-community.svg" alt="" width="27.2726" height="15" />
          <span>커뮤니티</span>
        </a>
        <a href="photo.html" class="bottom-nav__item is-active" aria-current="page" data-current>
          <img src="public/assets/community/nav-photo.svg" alt="" width="28" height="28" />
          <span>사진</span>
        </a>
        <a href="#" class="bottom-nav__item">
          <img src="public/assets/community/nav-chat.svg" alt="" width="24" height="24" />
          <span>채팅</span>
        </a>
      </nav>
    </div>

    <script>
      const gallery = document.querySelector(".gallery");
      const toggles = document.querySelectorAll(".view-toggle__btn");
      toggles.forEach((btn) =>
        btn.addEventListener("click", () => {
          gallery.dataset.view = btn.dataset.view;
          gallery.scrollLeft = 0;
          toggles.forEach((b) => {
            const on = b === btn;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-pressed", on);
          });
        })
      );
    </script>
    <script src="nav.js"></script>
  </body>
</html>
